name = "NRR"
defaultTargets = ["NRR", "HumanVerification", "Challenge", "Solution"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "NRR"
globs = ["NRR", "NRR.+"]

[[lean_lib]]
name = "HumanVerification"
globs = ["HumanVerification.+"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
